name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Contracts, build and tests against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vendored contracts match the iriai-proto v0.1.0 release
        run: npm run check-contracts
      - name: Tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          npm test | tee test-output.txt
          grep -q '^# skipped 0$' test-output.txt || { echo "::error::tests were skipped"; exit 1; }
      - name: Container builds
        run: docker build -t iriai-proto-index .
