name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Contracts, build and tests against PostgreSQL and Elasticsearch
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health" --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vendored contracts match the iriai-proto v0.1.0 release
        run: npm run check-contracts
      - name: Tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_ELASTICSEARCH_URL: http://localhost:9200
        run: |
          npm test | tee test-output.txt
          grep -q '^# skipped 0$' test-output.txt || { echo "::error::tests were skipped"; exit 1; }
      - name: Container builds
        run: docker build -t iriai-proto-index .
